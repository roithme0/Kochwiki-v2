<main>
  <!-- loading -->
  @if(shoppingListService.isLoading() == true){
  <div class="spinner-wrapper">
    <mat-spinner diameter="25" />
  </div>
  }

  <!-- error -->
  @else if (shoppingListService.hasError() == true) {
  <div class="error-wrapper">
    <div class="error">
      <mat-icon aria-hidden="false" aria-label="Fehler" fontIcon="error" />
      <p>Einkaufsliste konnte nicht geladen werden.</p>
    </div>
  </div>
  }

  <!-- loaded -->
  @else{
  <app-shopping-list-table-controls />
  <div class="table-wrapper">
    <app-shopping-list-table
      [shoppingList]="shoppingListService.shoppingList()"
      [shoppingListItemVerboseNames]="
        shoppingListService.shoppingListItemVerboseNames()
      "
    />
  </div>
  <app-shopping-list-table-buttons />
  }
</main>
