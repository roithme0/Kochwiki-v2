<mat-form-field
  appearance="outline"
  floatLabel="always"
  class="foodstuff-field"
>
  <mat-label>Lebensmittel</mat-label>
  <mat-select
    [formControl]="foodstuffIdControl"
    single
    (selectionChange)="selectedFoodstuffId.set(foodstuffIdControl.value)"
  >
    <mat-option disabled selected></mat-option>
    @for(foodstuff of foodstuffs(); track foodstuff.id) {
    <mat-option [value]="foodstuff.id">{{ foodstuff.name }}</mat-option
    >}
  </mat-select>
</mat-form-field>

<mat-form-field appearance="outline" floatLabel="always" class="amount-field">
  <mat-label>Menge</mat-label>
  <input matInput type="number" [formControl]="ingredientControl" />
  @if(selectedFoodstuff() != undefined){
  <span matTextSuffix>{{ selectedFoodstuff()?.unitVerbose }}</span>
  }
</mat-form-field>
