<main>
  @if (recipesState().status === 'loading') {
  <div class="spinner-wrapper">
    <mat-spinner diameter="25" />
  </div>
  } @else if (recipesState().status === 'error') {
  <p>Ein Fehler ist aufgetreten</p>
  } @else {
  <div class="grid-wrapper">
    <app-recipes-grid
      class="recipes-grid"
      [recipes]="recipesState().data"
    />
    <div
      class="fade-effect-wrapper"
      [ngClass]="showSearch() ? 'show' : 'hide'"
    ></div>
  </div>

  <div class="bottom-elements">
    <app-recipes-search [recipes]="recipesState().data" />

    <button
      mat-mini-fab
      (click)="openCreateRecipeDialog()"
      class="medium-size-button"
    >
      <mat-icon aria-hidden="false" aria-label="Hinzufügen" fontIcon="add" />
    </button>
  </div>
  }
</main>
