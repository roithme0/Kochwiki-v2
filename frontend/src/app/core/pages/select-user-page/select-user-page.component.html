<main>
  <nav>
    @for(user of users(); track user.id){
    <mat-card (click)="onUserSelected(user)">
      <mat-card-content>
        <img src="../../assets/icons/hide_image.svg" />
      </mat-card-content>

      <mat-card-header>
        <mat-card-title>{{ user.username }}</mat-card-title>
      </mat-card-header>
    </mat-card>
    }
  </nav>

  <button
    mat-mini-fab
    (click)="openUserCreateDialog()"
    class="create-user-button medium-size-button"
  >
    <mat-icon aria-hidden="false" aria-label="Hinzufügen" fontIcon="add" />
  </button>
</main>
