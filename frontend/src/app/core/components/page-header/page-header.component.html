<mat-toolbar class="toolbar">
  <!-- home -->
  @if(pageHeaderService.showHome()){
  <button
    mat-icon-button
    color="accent"
    aria-setsize=""
    routerLink=""
    routerLinkActive="active"
    class="medium-size-button"
  >
    <mat-icon aria-hidden="false" aria-label="Home" fontIcon="home" /></button
  >}

  <div class="headline-wrapper">
    <span class="headline">{{ pageHeaderService.headline() }}</span>

    @if(environmentName != 'prod' ){
    <span class="environment">{{ environmentName }}</span>
    }
  </div>

  <span class="spacer"></span>

  <!-- back arrow -->
  @if(pageHeaderService.showBack() == true){
  <button
    mat-icon-button
    color="accent"
    class="medium-size-button"
    routerLinkActive="active"
    [routerLink]="pageHeaderService.back()"
  >
    <mat-icon aria-hidden="false" aria-label="Zurück" fontIcon="arrow_back" />
  </button>
  }

  @if(pageHeaderService.showUserOptions()){
  <button
    mat-icon-button
    color="accent"
    [matMenuTriggerFor]="userOptionsMenu"
    aria-label="Benutzeroptionen öffnen"
    class="medium-size-button"
  >
    <mat-icon aria-hidden="true" fontIcon="more_vert" />
  </button>

  <mat-menu #userOptionsMenu="matMenu">
    <div class="user-options-username" aria-label="Aktiver Benutzer">
      {{ activeUserService.activeUser()?.username }}
    </div>
    <button mat-menu-item (click)="activeUserService.switchUser()">
      Benutzer wechseln
    </button>
  </mat-menu>
  }
</mat-toolbar>
