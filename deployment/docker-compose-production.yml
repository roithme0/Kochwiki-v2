name: kochwiki-v2-production

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kochwiki
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./production/postgresql/data:/var/lib/postgresql/data

  backend:
    image: roithme0/kochwiki-v2-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/kochwiki
    depends_on:
      - db

  frontend:
    image: roithme0/kochwiki-v2-frontend:latest
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
