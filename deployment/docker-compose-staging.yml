---
version: "3.1"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kochwiki
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - /volume1/docker/Kochwiki-v2/staging/postgresql/data:/var/lib/postgresql/data

  backend:
    image: roithme0/kochwiki-v2-backend:alpha
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/kochwiki
    depends_on:
      - db

  frontend:
    image: roithme0/kochwiki-v2-frontend:alpha
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - 8001:80
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
