services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kochwiki
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kochwiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-app:
    build:
      context: "../backend"
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/kochwiki
      CORS_ORIGINS: http://localhost:8000,http://localhost:4200

  angular-app:
    build:
      context: "../frontend"
      dockerfile: Dockerfile
      args:
        CONFIGURATION: local
    ports:
      - 8000:80
    depends_on:
      - backend-app
