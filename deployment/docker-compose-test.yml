services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kochwiki_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d kochwiki_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: "../backend"
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@db:5432/kochwiki_test
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest"
